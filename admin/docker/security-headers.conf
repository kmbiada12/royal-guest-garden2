# En-têtes de sécurité du back-office (inclus dans chaque bloc location).
# img-src : site public (aperçu des img/…), stockage Supabase, Unsplash.
# connect-src : API Supabase locale + projets hébergés.
# HSTS (Strict-Transport-Security) est à ajouter chez l'hébergeur HTTPS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http://localhost:3003 http://127.0.0.1:54321 http://localhost:54321 https://images.unsplash.com https://*.supabase.co; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Robots-Tag "noindex, nofollow" always;
