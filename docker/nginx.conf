# Royal Guest Garden — nginx (site statique)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Fichiers cachés (.git, .env…) : jamais servis.
    location ~ /\. {
        return 404;
    }

    # Pages, CSS, JS : toujours revalidés (pas de noms versionnés ; le
    # contenu des pages change via Supabase).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Images : mises en cache une semaine.
    location ~* \.(png|jpe?g|webp|svg|ico|gif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
