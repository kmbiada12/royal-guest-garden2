# En-têtes de sécurité — inclus dans chaque bloc qui ajoute ses propres
# en-têtes (nginx n'hérite pas des add_header du niveau supérieur).
# connect-src : Supabase local (développement) + projets hébergés.
# style-src 'unsafe-inline' : quelques attributs style="" dans les pages.
# HSTS (Strict-Transport-Security) est à ajouter chez l'hébergeur HTTPS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com http://127.0.0.1:54321 http://localhost:54321 https://*.supabase.co; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
